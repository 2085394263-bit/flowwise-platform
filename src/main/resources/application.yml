server:
  port: 8099

spring:
  application:
    name: flowwise-platform
  datasource:
    url: jdbc:h2:file:./data/flowwise-modern;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${FLOWWISE_H2_CONSOLE_ENABLED:false}
      path: /h2-console
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      audio:
        speech: none
        transcription: none
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:}
      chat:
        model: ${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  level:
    dev.flowwise: INFO
